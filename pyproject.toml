[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "film-style-analyzer"
version = "1.0.0"
description = "Analyze finished films across genres (wedding, commercial, brand content, social shorts, music videos, documentary) and generate per-genre editing style guides"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lifeupriver" }]
keywords = ["video", "editing", "style-transfer", "mcp", "claude", "gemini", "wedding-film", "commercial", "music-video", "documentary"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "scenedetect[opencv]>=0.6.7",
]

[project.urls]
Homepage = "https://github.com/lifeupriver/film-style"
Repository = "https://github.com/lifeupriver/film-style"
Documentation = "https://github.com/lifeupriver/film-style#readme"
Issues = "https://github.com/lifeupriver/film-style/issues"

[project.optional-dependencies]
audio = [
    "whisperx>=3.3.0",
    "inaSpeechSegmenter>=0.7",
]
gemini = [
    "google-generativeai>=0.8",
]
music = [
    "librosa>=0.10",
]
vimeo = [
    "yt-dlp>=2024.5.0",
]
mcp = [
    "mcp>=1.0",
]
shots = [
    "mediapipe>=0.10,<0.10.21",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "deepface>=0.0.93",
    "tensorflow>=2.16,<2.19",
    "tf-keras>=2.16,<2.19",
    "protobuf>=4.21,<5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E731", "E402", "F841", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
film-style = "film_style_analyzer.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
film_style_analyzer = [
    "static/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "genre_packs/*.toml",
]
